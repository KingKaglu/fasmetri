name: Match products (safe canonical matcher)

# Runs automatically after each store sync completes successfully,
# or manually from the admin sync page / Actions tab.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Zoommer phones sync"
      - "Zoommer laptops sync"
      - "EE phones sync"
      - "EE laptops sync"
      # PCShop syncs phones, laptops AND consoles in one workflow. Leaving it out
      # meant PCShop offers were imported but never matched to a canonical, so
      # they never joined a price comparison.
      - "PCShop sync"
    types:
      - completed

jobs:
  match:
    # For workflow_run, only chain when the sync actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.EU_DATABASE_URL }}
      DATABASE_POOL_MAX: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # "PCShop sync" carries all three categories, so it matches all three.
      - name: Match phones
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.name, 'phones') || contains(github.event.workflow_run.name, 'pcshop') }}
        run: npm run match:phones -- --all

      - name: Match laptops
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.name, 'laptops') || contains(github.event.workflow_run.name, 'pcshop') }}
        run: npm run match:laptops -- --all

      - name: Match consoles
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.name, 'consoles') || contains(github.event.workflow_run.name, 'pcshop') }}
        run: npm run match:consoles -- --all

      # Matching changes public visibility, so bust the deployed cache too.
      - name: Revalidate public catalog cache
        continue-on-error: true
        run: >-
          curl -fsS --retry 3
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          https://fasmetri.vercel.app/api/revalidate
