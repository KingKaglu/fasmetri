name: Match products (safe canonical matcher)

# Runs automatically after each store sync completes successfully,
# or manually from the admin sync page / Actions tab.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Zoommer phones sync"
      - "Zoommer laptops sync"
      - "EE phones sync"
      - "EE laptops sync"
      - "PCShop sync"
    types:
      - completed

jobs:
  match:
    # For workflow_run, only chain when the sync actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.EU_DATABASE_URL }}
      DATABASE_POOL_MAX: "1"
      # PCShop's one workflow covers phones, laptops and consoles.
      ALL_CATEGORIES: ${{ contains(github.event.workflow_run.name, 'PCShop') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Match phones
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.name, 'phones') || env.ALL_CATEGORIES == 'true' }}
        run: npm run match:phones -- --all

      - name: Match laptops
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.name, 'laptops') || env.ALL_CATEGORIES == 'true' }}
        run: npm run match:laptops -- --all

      - name: Match consoles
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.name, 'consoles') || env.ALL_CATEGORIES == 'true' }}
        run: npm run match:consoles -- --all

      # The matcher writes the canonical layer, but the public catalogue groups
      # by Product — so a canonical link alone changes nothing a visitor sees.
      # These bridge that gap on evidence that is certain, and re-splitting runs
      # before re-merging so a bad group is broken up before anything joins it.
      - name: Bridge canonical matches into the public catalogue
        continue-on-error: true
        run: npm run catalog:bridge

      # Matching changes public visibility, so bust the deployed cache too.
      - name: Revalidate public catalog cache
        continue-on-error: true
        run: >-
          curl -fsS --retry 3
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          https://fasmetri.ge/api/revalidate
